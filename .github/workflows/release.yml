name: release

# Build des installateurs desktop sur chaque OS (Tauri ne cross-compile pas l'installateur
# Windows depuis Linux → un runner par cible). Pousse un tag `v0.1.0` pour publier une Release
# avec les .msi/.exe (Windows) et .deb/.rpm/.AppImage (Linux). Lancement manuel = build sans publier.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  bundle:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04   # 22.04 = glibc plus ancien → AppImage compatible plus largement
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système Linux (WebKitGTK + AppImage)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Sidecar backend figé par OS (le binaire est natif, pas portable entre OS).
      - name: Build sidecar backend (PyInstaller)
        working-directory: backend
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm rawstudio-backend.spec

      - name: Install deps frontend
        working-directory: frontend
        run: npm ci

      # tauri-action lance beforeBuildCommand (build Vite), compile le shell Rust, bundle les
      # installateurs et, si tagName est fourni, les attache à une Release GitHub (draft, pour
      # téléchargement humain). Avec les secrets TAURI_SIGNING_* (issue #14) il signe chaque
      # binaire et génère les .sig dans target/release/bundle. L'auto-update NE passe PAS par
      # GitHub (repo privé -> assets non lisibles par l'updater non authentifié) mais par R2,
      # publié à l'étape suivante. Secrets signing à générer via `npx tauri signer generate`.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: 'RawStudio ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false

      # Publie artefacts updater + manifeste par plateforme sur R2 (source lue par l'updater).
      # Seulement sur tag : workflow_dispatch sert à valider le build sans rien publier.
      - name: Publier la mise à jour sur R2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: '63c0970bbb95c016789e74671e5e24c6'
        run: node scripts/publish-r2.mjs
