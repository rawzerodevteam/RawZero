[package]
name = "rsfast"
version = "0.1.0"
edition = "2021"

# Accélérateur natif des étages pur-NumPy du pipeline RawStudio.
# cdylib appelé depuis Python via ctypes (pas de maturin/PyO3 requis).
# Aucune dépendance externe : parallélisme via std::thread (build hors-ligne).
[lib]
name = "rsfast"
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
