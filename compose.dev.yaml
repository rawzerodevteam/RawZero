# RawStudio — environnement de DÉVELOPPEMENT (hot reload) sous Podman / Docker.
#   docker compose -f compose.dev.yaml up --build      (ou: podman compose -f compose.dev.yaml up --build)
# Puis ouvrir http://localhost:5173  (frontend Vite, proxy /api -> service backend)
#
# Différences avec compose.yaml (prod) : sources montées en volume, uvicorn --reload côté
# backend et serveur Vite côté frontend → toute modif de code est prise en compte à chaud,
# sans rebuild d'image.
services:
  backend:
    # Réutilise l'image prod (deps Python + libgomp1 déjà installées) ; seul le code est monté.
    build:
      context: .
      dockerfile: Containerfile
    command: python -m uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port 8000 --reload
    environment:
      DATA_DIR: /data
      IMPORT_DIR: /import
      STATIC_DIR: ""          # en dev le frontend est servi par Vite, pas par le backend
    volumes:
      - ./backend:/app/backend:Z   # code live → --reload
      - ./data:/data:Z
      - ./import:/import:Z
    ports:
      - "8000:8000"

  frontend:
    image: docker.io/library/node:22-slim
    working_dir: /app/frontend
    command: sh -c "npm ci --no-fund --no-audit && npm run dev -- --host"
    environment:
      VITE_API_PROXY: http://backend:8000   # le proxy Vite tape le service backend
    volumes:
      - ./frontend:/app/frontend:Z
      - /app/frontend/node_modules          # volume anonyme : garde les binaires Linux du conteneur
    ports:
      - "5173:5173"
    depends_on:
      - backend
