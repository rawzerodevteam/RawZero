# RawZero — orchestration Podman (podman-compose) / Docker Compose.
#   podman compose -f deploy/compose.yaml up -d        (ou : podman-compose ...)
#   podman compose -f deploy/compose.yaml up --build   pour reconstruire l'image
# Puis ouvrir http://localhost:8000
# Contexte de build = racine du dépôt (..) ; les chemins de volumes sont relatifs à ce fichier.
services:
  rawzero:
    build:
      context: ..
      dockerfile: deploy/Containerfile
    image: localhost/rawzero:latest
    container_name: rawzero
    ports:
      - "8000:8000"
    volumes:
      # Catalogue, originaux, caches, exports — persistés sur l'hôte (cf. DATA_DIR).
      # Les modèles ONNX (masques IA / débruitage) se déposent dans ./data/models.
      - ../data:/data:Z
      # Dépôt de fichiers à importer via « Import → /import » dans l'app.
      - ../import:/import:Z
    restart: unless-stopped
